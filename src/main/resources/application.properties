# ===== APPLICATION =====
spring.application.name=LMS-App
server.port=8080

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false

# ===== THYMELEAF =====
# We use React (frontend) not Thymeleaf templates. Disable check to remove WARN.
spring.thymeleaf.check-template-location=false

# ===== JWT CONFIG (values come from application-local.properties) =====
jwt.expiration=86400000

# ===== LOGGING =====
logging.level.com.lms.app=DEBUG
logging.level.org.springframework.security=DEBUG

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info

# ===== ACTIVATE LOCAL PROFILE =====
spring.profiles.active=local